<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMMF Performance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts pour style Dashboard -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-digital {
            font-family: 'Orbitron', monospace;
        }
        .gauge-card {
            background: radial-gradient(135% 135% at 50% 10%, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .gauge-ring {
            background: conic-gradient(from 180deg, #dc2626 var(--progress), #1e293b 0deg);
        }
        .glow-red {
            text-shadow: 0 0 12px rgba(220, 38, 38, 0.7);
        }
        .glow-blue {
            text-shadow: 0 0 12px rgba(37, 99, 235, 0.7);
        }
        .glow-green {
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 pb-20">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [counters, setCounters] = React.useState(() => {
                const saved = localStorage.getItem('tmmf_counters_v2');
                return saved ? JSON.parse(saved) : {
                    hzi: 63.58,
                    hs: 49.64,
                    cp: 8.32,
                    cet: 4.00
                };
            });

            const [logs, setLogs] = React.useState(() => {
                const saved = localStorage.getItem('tmmf_work_logs_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [shift, setShift] = React.useState('Matin');
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [startTime, setStartTime] = React.useState('05:35');
            const [endTime, setEndTime] = React.useState('13:20');
            const [breakMin, setBreakMin] = React.useState(41);
            const [overtimeMin, setOvertimeMin] = React.useState(0);
            const [targetCounter, setTargetCounter] = React.useState('STANDARD');
            const [comment, setComment] = React.useState('Poste du Matin');

            React.useEffect(() => {
                localStorage.setItem('tmmf_work_logs_v2', JSON.stringify(logs));
                localStorage.setItem('tmmf_counters_v2', JSON.stringify(counters));
            }, [logs, counters]);

            const handleShiftChange = (selectedShift) => {
                setShift(selectedShift);
                if (selectedShift === 'Matin') {
                    setStartTime('05:35');
                    setEndTime('13:20');
                    setBreakMin(41);
                    setComment('Poste du Matin');
                } else if (selectedShift === 'Après-midi') {
                    setStartTime('13:47');
                    setEndTime('21:28');
                    setBreakMin(36);
                    setComment('Poste Après-midi');
                }
            };

            const calculateHours = (start, end, pause) => {
                if (!start || !end) return 0;
                const [h1, m1] = start.split(':').map(Number);
                const [h2, m2] = end.split(':').map(Number);
                let totalMinutes = (h2 * 60 + m2) - (h1 * 60 + m1) - (pause || 0);
                if (totalMinutes < 0) totalMinutes += 24 * 60;
                return totalMinutes / 60;
            };

            const currentDuration = calculateHours(startTime, endTime, breakMin);

            const handleAddLog = (e) => {
                e.preventDefault();
                const duration = calculateHours(startTime, endTime, breakMin);
                const overtimeHours = overtimeMin / 60;
                
                const newEntry = {
                    id: Date.now(),
                    date,
                    shift,
                    startTime,
                    endTime,
                    breakMin,
                    duration,
                    overtimeMin,
                    targetCounter,
                    comment
                };

                setLogs([newEntry, ...logs]);

                let updatedCounters = { ...counters };
                if (targetCounter === 'HZI') {
                    updatedCounters.hzi += duration;
                } else if (targetCounter === 'HS' || overtimeMin > 0) {
                    updatedCounters.hs += duration + overtimeHours;
                }
                setCounters(updatedCounters);
            };

            const handleDelete = (id) => {
                setLogs(logs.filter(item => item.id !== id));
            };

            // Regroupement mensuel pour la paie avec décalage M-1
            const getMonthlyStats = () => {
                const months = {};
                logs.forEach(l => {
                    const monthKey = l.date.substring(0, 7); // YYYY-MM
                    if (!months[monthKey]) {
                        months[monthKey] = { totalHours: 0, overtime: 0, entries: 0 };
                    }
                    months[monthKey].totalHours += l.duration;
                    months[monthKey].overtime += (l.overtimeMin / 60);
                    months[monthKey].entries += 1;
                });
                return Object.entries(months).sort((a, b) => b[0].localeCompare(a[0]));
            };

            const getPayMonthName = (workMonthStr) => {
                const [year, month] = workMonthStr.split('-').map(Number);
                const dateObj = new Date(year, month - 1 + 1, 1); // Mois suivant M+1
                return {
                    workMonth: new Date(year, month - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }),
                    payMonth: dateObj.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })
                };
            };

            const todayFormatted = new Date().toLocaleDateString('fr-FR', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    {/* Header Cockpit Automotive */}
                    <header className="flex flex-col sm:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-3 h-10 bg-red-600 rounded-full animate-pulse"></div>
                            <div>
                                <h1 className="text-2xl font-black tracking-wider uppercase text-white font-digital">
                                    TMMF <span className="text-red-500">COCKPIT</span>
                                </h1>
                                <p className="text-xs text-slate-400 font-mono">SUIVI HORAIRE & COMPTEURS DE PAIE</p>
                            </div>
                        </div>
                        {/* Horloge / Date du jour XXL */}
                        <div className="text-center sm:text-right border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-6 w-full sm:w-auto">
                            <span className="text-xs uppercase text-slate-500 font-bold tracking-widest block">Aujourd'hui</span>
                            <div className="text-lg sm:text-xl font-bold text-slate-100 capitalize font-digital glow-red">
                                {todayFormatted}
                            </div>
                        </div>
                    </header>

                    {/* Compteurs Style Tableau de Bord / Jauges Auto */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* Compteur HZI */}
                        <div className="gauge-card p-4 rounded-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                            <span className="text-xs font-bold text-slate-400 tracking-wider mb-2">COMPTEUR HZI</span>
                            <div className="text-3xl font-black font-digital text-red-500 glow-red my-1">
                                {counters.hzi.toFixed(2)} <span className="text-sm text-slate-400 font-sans">h</span>
                            </div>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div className="bg-red-600 h-full" style={{ width: `${Math.min((counters.hzi / 100) * 100, 100)}%` }}></div>
                            </div>
                        </div>

                        {/* Compteur HS */}
                        <div className="gauge-card p-4 rounded-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                            <span className="text-xs font-bold text-slate-400 tracking-wider mb-2">HEURES SUP. (HS)</span>
                            <div className="text-3xl font-black font-digital text-blue-400 glow-blue my-1">
                                {counters.hs.toFixed(2)} <span className="text-sm text-slate-400 font-sans">h</span>
                            </div>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div className="bg-blue-500 h-full" style={{ width: `${Math.min((counters.hs / 80) * 100, 100)}%` }}></div>
                            </div>
                        </div>

                        {/* Compteur CP */}
                        <div className="gauge-card p-4 rounded-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                            <span className="text-xs font-bold text-slate-400 tracking-wider mb-2">CONGÉS PAYÉS</span>
                            <div className="text-3xl font-black font-digital text-emerald-400 glow-green my-1">
                                {counters.cp.toFixed(2)} <span className="text-sm text-slate-400 font-sans">j</span>
                            </div>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div className="bg-emerald-500 h-full" style={{ width: `${Math.min((counters.cp / 30) * 100, 100)}%` }}></div>
                            </div>
                        </div>

                        {/* Compteur CET */}
                        <div className="gauge-card p-4 rounded-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                            <span className="text-xs font-bold text-slate-400 tracking-wider mb-2">COMPTEUR CET</span>
                            <div className="text-3xl font-black font-digital text-amber-400 my-1">
                                {counters.cet.toFixed(2)} <span className="text-sm text-slate-400 font-sans">h</span>
                            </div>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div className="bg-amber-500 h-full" style={{ width: `${Math.min((counters.cet / 50) * 100, 100)}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* Formulaire de Saisie du Poste */}
                    <div className="gauge-card p-5 sm:p-6 rounded-2xl">
                        <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                            <h2 className="text-base font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-red-500"></span> SAISIE DU POSTE
                            </h2>
                            {/* Sélecteur d'équipe Matin / Après-midi uniquement */}
                            <div className="flex gap-2">
                                <button 
                                    type="button" 
                                    onClick={() => handleShiftChange('Matin')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold font-digital transition ${shift === 'Matin' ? 'bg-red-600 text-white shadow-lg shadow-red-900/40' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                >
                                    MATIN (05:35)
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => handleShiftChange('Après-midi')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold font-digital transition ${shift === 'Après-midi' ? 'bg-red-600 text-white shadow-lg shadow-red-900/40' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                >
                                    APRÈS-MIDI (13:47)
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleAddLog} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Date du poste</label>
                                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-100 font-mono outline-none focus:border-red-500" required />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Impact Compteur</label>
                                <select value={targetCounter} onChange={(e) => setTargetCounter(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-bold text-red-400 outline-none focus:border-red-500">
                                    <option value="STANDARD">Temps Normal</option>
                                    <option value="HZI">Alimenter HZI</option>
                                    <option value="HS">Alimenter Heures Sup (HS)</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Début & Fin</label>
                                <div className="flex gap-2">
                                    <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-slate-100" required />
                                    <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-slate-100" required />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Pause Obligatoire (min)</label>
                                <input type="number" value={breakMin} onChange={(e) => setBreakMin(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-slate-100" />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Prolongation / Overtime (min)</label>
                                <input type="number" value={overtimeMin} onChange={(e) => setOvertimeMin(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-slate-100" placeholder="ex: 15" />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Commentaire</label>
                                <input type="text" value={comment} onChange={(e) => setComment(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-100" />
                            </div>

                            <div className="sm:col-span-2 lg:col-span-3 pt-2">
                                <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-digital font-bold py-3 rounded-xl text-sm transition tracking-widest shadow-lg shadow-red-900/30 uppercase">
                                    ENREGISTRER LA SÉANCE ({currentDuration.toFixed(2)} HRS)
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* MODULE SUIVI DU MOIS & FICHE DE PAIE (DÉCALAGE M-1 TMMF) */}
                    <div className="gauge-card p-5 sm:p-6 rounded-2xl border-t-2 border-t-red-600">
                        <div className="mb-4">
                            <h2 className="text-lg font-bold font-digital text-white uppercase flex items-center gap-2">
                                📊 SYNTHÈSE MENSUELLE & FICHE DE PAIE
                            </h2>
                            <p className="text-xs text-slate-400 mt-1">
                                Comparatif avec décalage de paie TMMF (Ex: les heures réelles de <strong className="text-slate-200">l'Abonnement d'Août</strong> sont versées sur la <strong className="text-red-400">Fiche de Paie du 30 Septembre</strong>).
                            </p>
                        </div>

                        <div className="space-y-3">
                            {getMonthlyStats().length === 0 ? (
                                <p className="text-xs text-slate-500 py-4 text-center font-mono">Aucune donnée mensuelle accumulée.</p>
                            ) : (
                                getMonthlyStats().map(([monthKey, stat]) => {
                                    const { workMonth, payMonth } = getPayMonthName(monthKey);
                                    return (
                                        <div key={monthKey} className="bg-slate-950/70 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div>
                                                <span className="text-xs font-bold text-red-500 font-digital uppercase tracking-wider">Mois Travaillé : {workMonth}</span>
                                                <div className="text-sm font-bold text-slate-200 mt-0.5">
                                                    Payé sur le bulletin de : <span className="text-emerald-400 font-digital uppercase">{payMonth}</span>
                                                </div>
                                            </div>
                                            <div className="flex gap-4 items-center w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 border-slate-800 pt-2 sm:pt-0">
                                                <div className="text-right">
                                                    <span className="text-[10px] text-slate-500 block uppercase font-bold">Total Réalisé</span>
                                                    <span className="text-base font-black font-digital text-slate-100">{stat.totalHours.toFixed(2)} h</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[10px] text-slate-500 block uppercase font-bold">Heures Sup</span>
                                                    <span className="text-base font-black font-digital text-blue-400">+{stat.overtime.toFixed(2)} h</span>
                                                </div>
                                                <div className="bg-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-slate-300 font-mono">
                                                    {stat.entries} postes
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Historique des Séances */}
                    <div className="gauge-card p-5 rounded-2xl">
                        <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3">Dernières saisies</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs font-mono">
                                <thead>
                                    <tr className="text-slate-500 border-b border-slate-800">
                                        <th className="pb-2">Date</th>
                                        <th className="pb-2">Poste</th>
                                        <th className="pb-2">Horaires</th>
                                        <th className="pb-2">Durée</th>
                                        <th className="pb-2 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {logs.map((log) => (
                                        <tr key={log.id} className="text-slate-300">
                                            <td className="py-2.5 font-bold text-slate-200">{log.date}</td>
                                            <td className="py-2.5"><span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[10px] font-bold">{log.shift}</span></td>
                                            <td className="py-2.5">{log.startTime} - {log.endTime}</td>
                                            <td className="py-2.5 font-bold text-red-400">{log.duration.toFixed(2)} h</td>
                                            <td className="py-2.5 text-right">
                                                <button onClick={() => handleDelete(log.id)} className="text-slate-500 hover:text-red-500">Supprimer</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
