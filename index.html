<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi TMMF & Compteurs</title>
    <!-- Tailwind CSS pour un design moderne et propre -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour interpréter le code JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [counters, setCounters] = React.useState(() => {
                const saved = localStorage.getItem('tmmf_counters');
                return saved ? JSON.parse(saved) : {
                    hzi: 63.58,
                    hs: 49.64,
                    cp1: 8.32,
                    cp2: 8.32,
                    cet: 4.00
                };
            });

            const [logs, setLogs] = React.useState(() => {
                const saved = localStorage.getItem('tmmf_work_logs');
                return saved ? JSON.parse(saved) : [];
            });

            const [shift, setShift] = React.useState('Matin');
            const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [startTime, setStartTime] = React.useState('05:35');
            const [endTime, setEndTime] = React.useState('13:20');
            const [breakMin, setBreakMin] = React.useState(41);
            const [overtimeMin, setOvertimeMin] = React.useState(0);
            const [targetCounter, setTargetCounter] = React.useState('STANDARD');
            const [comment, setComment] = React.useState('Poste du Matin');

            React.useEffect(() => {
                localStorage.setItem('tmmf_work_logs', JSON.stringify(logs));
                localStorage.setItem('tmmf_counters', JSON.stringify(counters));
            }, [logs, counters]);

            const handleShiftChange = (selectedShift) => {
                setShift(selectedShift);
                if (selectedShift === 'Matin') {
                    setStartTime('05:35');
                    setEndTime('13:20');
                    setBreakMin(41);
                    setComment('Poste du Matin');
                } else if (selectedShift === 'Après-midi') {
                    setStartTime('13:47');
                    setEndTime('21:28');
                    setBreakMin(36);
                    setComment('Poste Après-midi');
                } else if (selectedShift === 'Samedi HZI') {
                    setStartTime('05:35');
                    setEndTime('11:45');
                    setBreakMin(0);
                    setTargetCounter('HZI');
                    setComment('Samedi rattrapage HZI');
                }
            };

            const calculateHours = (start, end, pause) => {
                if (!start || !end) return 0;
                const [h1, m1] = start.split(':').map(Number);
                const [h2, m2] = end.split(':').map(Number);
                let totalMinutes = (h2 * 60 + m2) - (h1 * 60 + m1) - (pause || 0);
                if (totalMinutes < 0) totalMinutes += 24 * 60;
                return totalMinutes / 60;
            };

            const currentDuration = calculateHours(startTime, endTime, breakMin);

            const handleAddLog = (e) => {
                e.preventDefault();
                const duration = calculateHours(startTime, endTime, breakMin);
                const overtimeHours = overtimeMin / 60;
                
                const newEntry = {
                    id: Date.now(),
                    date,
                    shift,
                    startTime,
                    endTime,
                    breakMin,
                    duration,
                    overtimeMin,
                    targetCounter,
                    comment
                };

                setLogs([newEntry, ...logs]);

                let updatedCounters = { ...counters };
                if (targetCounter === 'HZI') {
                    updatedCounters.hzi += duration;
                } else if (targetCounter === 'HS' || overtimeMin > 0) {
                    updatedCounters.hs += duration + overtimeHours;
                }
                setCounters(updatedCounters);

                alert('Séance enregistrée et compteurs mis à jour !');
            };

            const handleDelete = (id) => {
                setLogs(logs.filter(item => item.id !== id));
            };

            const exportICS = () => {
                let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//TMMF Suivi Horaire//FR\n";
                
                logs.forEach(l => {
                    const startClean = l.startTime.replace(':', '');
                    const endClean = l.endTime.replace(':', '');
                    const dateClean = l.date.replace(/-/g, '');
                    
                    icsContent += "BEGIN:VEVENT\n";
                    icsContent += `UID:tmmf-${l.id}@app.local\n`;
                    icsContent += `DTSTAMP:${dateClean}T000000Z\n`;
                    icsContent += `DTSTART:${dateClean}T${startClean}00\n`;
                    icsContent += `DTEND:${dateClean}T${endClean}00\n`;
                    icsContent += `SUMMARY:Poste TMMF (${l.shift})\n`;
                    icsContent += `DESCRIPTION:${l.comment} - Durée: ${l.duration.toFixed(2)}h\n`;
                    icsContent += "END:VEVENT\n";
                });

                icsContent += "END:VCALENDAR";

                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `planning_tmmf_${new Date().toISOString().split('T')[0]}.ics`;
                a.click();
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 max-w-4xl mx-auto">
                    <header className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4 border-slate-200">
                        <div>
                            <h1 className="text-2xl font-bold text-red-600 flex items-center gap-2">
                                Suivi TMMF & Compteurs
                            </h1>
                            <p className="text-sm text-slate-500">Gestion HZI, HS, CP, CET & Samsung Calendar</p>
                        </div>
                        <button
                            onClick={exportICS}
                            className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm"
                        >
                            Exporter vers Samsung Calendar (.ics)
                        </button>
                    </header>

                    {/* Cartes Compteurs TMMF */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold text-slate-400">Compteur HZI</span>
                            <p className="text-xl font-bold text-red-600">{counters.hzi.toFixed(2)} h</p>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold text-slate-400">Heures Sup (HS)</span>
                            <p className="text-xl font-bold text-blue-600">{counters.hs.toFixed(2)} h</p>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold text-slate-400">Congés Payés (CP)</span>
                            <p className="text-xl font-bold text-emerald-600">{counters.cp1.toFixed(2)} j</p>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <span className="text-xs font-semibold text-slate-400">CET Heures</span>
                            <p className="text-xl font-bold text-amber-600">{counters.cet.toFixed(2)} h</p>
                        </div>
                    </div>

                    {/* Formulaire de saisie */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <h2 className="text-lg font-bold mb-4">Enregistrer un poste</h2>

                        <div className="flex gap-2 mb-4 flex-wrap">
                            <button type="button" onClick={() => handleShiftChange('Matin')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 border">Matin (05:35)</button>
                            <button type="button" onClick={() => handleShiftChange('Après-midi')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 border">Après-midi (13:47)</button>
                            <button type="button" onClick={() => handleShiftChange('Samedi HZI')} className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-red-50 text-red-600 hover:bg-red-100 border border-red-200">Samedi HZI</button>
                        </div>

                        <form onSubmit={handleAddLog} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Date</label>
                                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-500" required />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Équipe</label>
                                <select value={shift} onChange={(e) => handleShiftChange(e.target.value)} className="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-500">
                                    <option value="Matin">Matin</option>
                                    <option value="Après-midi">Après-midi</option>
                                    <option value="Samedi HZI">Samedi HZI</option>
                                    <option value="Nuit">Nuit</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Compteur Cible</label>
                                <select value={targetCounter} onChange={(e) => setTargetCounter(e.target.value)} className="w-full p-2 border rounded-lg text-sm font-semibold text-red-600 outline-none">
                                    <option value="STANDARD">Temps Standard</option>
                                    <option value="HZI">Compteur HZI</option>
                                    <option value="HS">Heures Sup (HS)</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Début</label>
                                <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full p-2 border rounded-lg text-sm outline-none" required />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Fin</label>
                                <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className="w-full p-2 border rounded-lg text-sm outline-none" required />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Pause totale (min)</label>
                                <input type="number" value={breakMin} onChange={(e) => setBreakMin(Number(e.target.value))} className="w-full p-2 border rounded-lg text-sm outline-none" />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Overtime / Prolongation (min)</label>
                                <input type="number" min="0" max="60" value={overtimeMin} onChange={(e) => setOvertimeMin(Number(e.target.value))} className="w-full p-2 border rounded-lg text-sm outline-none" placeholder="ex: 15 min" />
                            </div>

                            <div className="sm:col-span-2">
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Commentaire</label>
                                <input type="text" value={comment} onChange={(e) => setComment(e.target.value)} className="w-full p-2 border rounded-lg text-sm outline-none" />
                            </div>

                            <div className="flex items-end">
                                <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-medium p-2 rounded-lg text-sm transition">
                                    Valider ({currentDuration.toFixed(2)} h)
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Historique */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-lg font-bold mb-4">Historique des postes</h2>
                        {logs.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-6">Aucun poste enregistré.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-500 border-b">
                                        <tr>
                                            <th className="p-3">Date</th>
                                            <th className="p-3">Équipe</th>
                                            <th className="p-3">Horaires</th>
                                            <th className="p-3">Durée</th>
                                            <th className="p-3">Compteur</th>
                                            <th className="p-3 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {logs.map((log) => (
                                            <tr key={log.id} className="hover:bg-slate-50">
                                                <td className="p-3 font-medium">{log.date}</td>
                                                <td className="p-3"><span className="bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs">{log.shift}</span></td>
                                                <td className="p-3">{log.startTime} - {log.endTime}</td>
                                                <td className="p-3 font-semibold">{log.duration.toFixed(2)} h {log.overtimeMin > 0 && <span className="text-xs text-blue-600">(+{log.overtimeMin}m)</span>}</td>
                                                <td className="p-3"><span className="px-2 py-1 rounded text-xs font-bold bg-red-100 text-red-700">{log.targetCounter}</span></td>
                                                <td className="p-3 text-right">
                                                    <button onClick={() => handleDelete(log.id)} className="text-slate-400 hover:text-red-600 transition">Supprimer</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
